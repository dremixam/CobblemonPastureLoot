modLoader = "javafml"
loaderVersion = "${neo_loader_version_range}"
license = "All-Rights-Reserved"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "PastureLoot"
description = '''Pastured pokémon randomly drop items from their loot table.'''
authors = "DrEmixam"
logoFile = "assets/pastureloot/icon.png"
displayURL = "https://modrinth.com/mod/cobblemon-pasture-loot"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version},1.22)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "cobblemon"
    type = "required"
    versionRange = "[${cobblemon_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "pastureloot.mixins.json"
