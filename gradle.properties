# Gradle Settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties (shared by all nodes)
mod_version=2.0.0
mod_id=pastureloot
maven_group=com.dremixam
archives_base_name=PastureLoot

# Same version as the one NeoForge 21.1 ships, embedded in the Fabric jar.
night_config_version=3.8.3

# Node specific properties (minecraft_version, loader versions, cobblemon_version, ...)
# are in versions/<version>-<loader>/gradle.properties.

# The Kotlin plugin is only there for Loom, fabric-language-kotlin already brings the stdlib.
kotlin.stdlib.default.dependency=false
