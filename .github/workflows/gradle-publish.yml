# On a new GitHub Release: build the jar of each node, attach them to the release and publish them
# on Modrinth. Needs the MODRINTH_TOKEN secret.

name: Build and Publish Release

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle
      run: ./gradlew :1.21.1-fabric:build :1.21.1-neoforge:build

    - name: Attach jars to the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for dir in versions/*/build/libs; do
          JAR=$(find "$dir" -maxdepth 1 -name "*.jar" ! -name "*-sources.jar")
          if [ -n "$JAR" ]; then
            echo "Uploading $JAR to release ${{ github.event.release.tag_name }}"
            gh release upload "${{ github.event.release.tag_name }}" "$JAR" --clobber --repo "${{ github.repository }}"
          fi
        done

    - name: Publish to Modrinth
      run: ./gradlew :1.21.1-fabric:modrinth :1.21.1-neoforge:modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        CHANGELOG: ${{ github.event.release.body }}
